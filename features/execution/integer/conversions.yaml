name: Integer narrowing conversions
description: Narrows integer values to byte, short, and char values.
status: implemented
spec: "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html#jvms-2.11.5"

criteria:
  - Narrows integers to signed byte values.
  - Narrows integers to signed short values.
  - Narrows integers to unsigned char values.
  - Promotes narrowed char values back to integers without sign extension.
