name: Virtual method invocation
description: Selects and invokes instance methods through class hierarchies.
status: partial
spec: "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-6.html#jvms-6.5.invokevirtual"

criteria:
  - Selects an override from the runtime receiver class.
  - Invokes concrete implementations of abstract superclass methods.
  - Invokes inherited concrete methods.
  - Resolves class method references through the declaring class and superclass hierarchy before interface fallback.
  - Resolves methods declared by direct and inherited superinterfaces.
  - Ignores private and static interface methods during class method resolution.
  - Selects a unique concrete maximally-specific superinterface method.
  - Rejects interface symbolic owners with IncompatibleClassChangeError.
  - Rejects unresolved method references with NoSuchMethodError.
  - Rejects resolved static methods used by invokevirtual with IncompatibleClassChangeError.
  - Enforces private method access, including same-nest access.

limitations:
  - Class method resolution does not implement signature-polymorphic lookup.
  - Access control does not yet implement all package, protected, public, module, and loader checks.
  - Virtual selection does not yet throw AbstractMethodError when no concrete implementation is selected.
  - Virtual selection does not yet throw IncompatibleClassChangeError for multiple concrete maximally-specific interface methods.
